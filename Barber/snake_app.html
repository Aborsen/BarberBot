<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #eee);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
    overflow-x: hidden;
  }

  h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  .score-display { font-size: 16px; margin-bottom: 10px; color: var(--tg-theme-hint-color, #aaa); }

  #gameCanvas {
    border: 2px solid var(--tg-theme-button-color, #4CAF50);
    border-radius: 8px;
    touch-action: none;
    max-width: 100%;
  }

  .btn {
    background: var(--tg-theme-button-color, #4CAF50);
    color: var(--tg-theme-button-text-color, #fff);
    border: none; border-radius: 10px;
    padding: 14px 28px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin: 8px 4px;
    transition: opacity 0.2s;
    width: 100%; max-width: 320px;
  }
  .btn:active { opacity: 0.7; }

  .leaderboard {
    width: 100%; max-width: 360px;
    margin-top: 12px;
  }
  .leaderboard h2 { font-size: 18px; margin-bottom: 8px; text-align: center; }
  .lb-table {
    width: 100%; border-collapse: collapse;
    background: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.05));
    border-radius: 10px; overflow: hidden;
  }
  .lb-table th, .lb-table td {
    padding: 10px 12px; text-align: left; font-size: 14px;
  }
  .lb-table th {
    background: var(--tg-theme-button-color, #4CAF50);
    color: var(--tg-theme-button-text-color, #fff);
    font-weight: 600;
  }
  .lb-table tr:nth-child(even) {
    background: rgba(255,255,255,0.03);
  }
  .lb-table td:last-child { text-align: right; font-weight: 600; }

  .name-input-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex; justify-content: center; align-items: center;
    z-index: 100;
  }
  .name-input-box {
    background: var(--tg-theme-bg-color, #1a1a2e);
    border: 1px solid var(--tg-theme-button-color, #4CAF50);
    border-radius: 14px; padding: 24px; text-align: center;
    width: 90%; max-width: 320px;
  }
  .name-input-box h3 { margin-bottom: 14px; font-size: 18px; }
  .name-input-box input {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--tg-theme-hint-color, #555);
    border-radius: 8px; margin-bottom: 14px;
    background: var(--tg-theme-secondary-bg-color, #222);
    color: var(--tg-theme-text-color, #eee);
    outline: none;
  }
  .name-input-box input:focus {
    border-color: var(--tg-theme-button-color, #4CAF50);
  }

  .game-over-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex; justify-content: center; align-items: center;
    z-index: 100;
  }
  .game-over-box {
    background: var(--tg-theme-bg-color, #1a1a2e);
    border: 1px solid var(--tg-theme-button-color, #4CAF50);
    border-radius: 14px; padding: 28px; text-align: center;
    width: 90%; max-width: 320px;
  }
  .game-over-box h2 { font-size: 22px; margin-bottom: 8px; }
  .game-over-box .final-score { font-size: 36px; font-weight: 700; margin: 10px 0;
    color: var(--tg-theme-button-color, #4CAF50); }

  .hidden { display: none !important; }
  .empty-msg { text-align: center; padding: 20px; color: var(--tg-theme-hint-color, #888); font-size: 14px; }
</style>
</head>
<body>

<div id="menuScreen">
  <h1>Snake Game</h1>
  <button class="btn" onclick="showNameInput()">Start New Game</button>
  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <div id="leaderboardContent"><p class="empty-msg">Loading...</p></div>
  </div>
</div>

<div id="gameScreen" class="hidden">
  <div class="score-display">Score: <span id="scoreText">0</span></div>
  <canvas id="gameCanvas"></canvas>
</div>

<div id="nameOverlay" class="name-input-overlay hidden">
  <div class="name-input-box">
    <h3>Enter Your Name</h3>
    <input type="text" id="playerNameInput" placeholder="Your name" maxlength="30" autocomplete="off">
    <button class="btn" onclick="startGameWithName()">Play!</button>
  </div>
</div>

<div id="gameOverOverlay" class="game-over-overlay hidden">
  <div class="game-over-box">
    <h2>Game Over</h2>
    <div class="final-score" id="finalScore">0</div>
    <p style="margin-bottom:16px;color:var(--tg-theme-hint-color,#aaa)">Score saved!</p>
    <button class="btn" onclick="backToMenu()">Back to Menu</button>
    <button class="btn" onclick="playAgain()">Play Again</button>
  </div>
</div>

<script>
// --- Config ---
const API_BASE = window.location.origin;
const GRID = 20;
let COLS, ROWS, CELL;
let tg = window.Telegram && window.Telegram.WebApp;
if (tg) tg.expand();

let playerName = '';
let snake, direction, nextDirection, food, score, gameLoop, gameRunning;

// --- Touch handling ---
let touchStartX, touchStartY;

function setupCanvas() {
  const canvas = document.getElementById('gameCanvas');
  const maxW = Math.min(window.innerWidth - 24, 400);
  CELL = Math.floor(maxW / GRID);
  COLS = GRID;
  ROWS = GRID;
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
  return canvas;
}

// --- Leaderboard ---
async function loadLeaderboard() {
  try {
    const res = await fetch(API_BASE + '/leaderboard');
    const data = await res.json();
    const container = document.getElementById('leaderboardContent');
    if (!data.length) {
      container.innerHTML = '<p class="empty-msg">No scores yet. Be the first!</p>';
      return;
    }
    let html = '<table class="lb-table"><tr><th>#</th><th>Player</th><th>Score</th></tr>';
    data.forEach((entry, i) => {
      const medal = i === 0 ? '&#129351;' : i === 1 ? '&#129352;' : i === 2 ? '&#129353;' : (i+1);
      html += `<tr><td>${medal}</td><td>${esc(entry.player_name)}</td><td>${entry.score}</td></tr>`;
    });
    html += '</table>';
    container.innerHTML = html;
  } catch (e) {
    document.getElementById('leaderboardContent').innerHTML =
      '<p class="empty-msg">Could not load leaderboard</p>';
  }
}

async function submitScore(name, sc) {
  try {
    await fetch(API_BASE + '/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_name: name, score: sc }),
    });
  } catch (e) { /* ignore */ }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Game Logic ---
function showNameInput() {
  document.getElementById('nameOverlay').classList.remove('hidden');
  document.getElementById('playerNameInput').value = '';
  document.getElementById('playerNameInput').focus();
}

function startGameWithName() {
  const input = document.getElementById('playerNameInput').value.trim();
  if (!input) return;
  playerName = input;
  document.getElementById('nameOverlay').classList.add('hidden');
  startGame();
}

function startGame() {
  const canvas = setupCanvas();
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');

  const startCol = Math.floor(COLS / 2);
  const startRow = Math.floor(ROWS / 2);
  snake = [{ x: startCol, y: startRow }];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  document.getElementById('scoreText').textContent = '0';
  placeFood();
  gameRunning = true;

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, 300);
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  if (!gameRunning) return;

  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return endGame();
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('scoreText').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--tg-theme-bg-color').trim() || '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(COLS * CELL, i * CELL); ctx.stroke();
  }

  // Snake
  const btnColor = getComputedStyle(document.body).getPropertyValue('--tg-theme-button-color').trim() || '#4CAF50';
  snake.forEach((seg, i) => {
    const brightness = 1 - (i / snake.length) * 0.4;
    ctx.fillStyle = i === 0 ? btnColor : adjustBrightness(btnColor, brightness);
    ctx.beginPath();
    ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
    ctx.fill();
  });

  // Food
  ctx.fillStyle = '#FF5252';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
}

function adjustBrightness(hex, factor) {
  if (!hex.startsWith('#')) return hex;
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.round(r * factor); g = Math.round(g * factor); b = Math.round(b * factor);
  return `rgb(${r},${g},${b})`;
}

async function endGame() {
  gameRunning = false;
  clearInterval(gameLoop);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
  await submitScore(playerName, score);
}

function backToMenu() {
  document.getElementById('gameOverOverlay').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  loadLeaderboard();
}

function playAgain() {
  document.getElementById('gameOverOverlay').classList.add('hidden');
  startGame();
}

// --- Keyboard controls ---
document.addEventListener('keydown', (e) => {
  if (!gameRunning) {
    if (e.key === 'Enter') {
      const overlay = document.getElementById('nameOverlay');
      if (!overlay.classList.contains('hidden')) startGameWithName();
    }
    return;
  }
  switch (e.key) {
    case 'ArrowUp':    if (direction.y !== 1)  nextDirection = { x: 0, y: -1 }; break;
    case 'ArrowDown':  if (direction.y !== -1) nextDirection = { x: 0, y: 1 };  break;
    case 'ArrowLeft':  if (direction.x !== 1)  nextDirection = { x: -1, y: 0 }; break;
    case 'ArrowRight': if (direction.x !== -1) nextDirection = { x: 1, y: 0 };  break;
  }
  e.preventDefault();
});

// --- Swipe controls ---
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!gameRunning) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return; // too short

  if (absDx > absDy) {
    if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
  } else {
    if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
    else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
  }
});

// --- Init ---
loadLeaderboard();
</script>
</body>
</html>
